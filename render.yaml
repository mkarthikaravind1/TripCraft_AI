# Render Blueprint for TripCraft AI.
# Check current Render pricing before deploying: if the free plan is not available
# for your account, change `plan: free` to a paid plan such as `starter`.
services:
  - type: web
    name: tripcraft-ai
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn tripcraft.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tripcraft-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tripcraft

databases:
  - name: tripcraft-db
    plan: free
    databaseName: tripcraft
    user: tripcraft
